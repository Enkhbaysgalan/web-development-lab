<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" font-family="Arial, sans-serif">
  <!-- Лаб 05: Wireframe — Гар утас (Mobile) хувилбар, 375px -->
  <rect x="0" y="0" width="375" height="812" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="12" y="20" font-size="12" fill="#64748b">MOBILE 375px — Wireframe</text>

  <!-- Header: логотип + гамбургер товч -->
  <rect x="0" y="30" width="375" height="56" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="14" y="44" width="120" height="28" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="26" y="63" font-size="12" fill="#475569">Логотип</text>
  <rect x="321" y="42" width="40" height="32" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <line x1="331" y1="51" x2="351" y2="51" stroke="#475569" stroke-width="3"/>
  <line x1="331" y1="58" x2="351" y2="58" stroke="#475569" stroke-width="3"/>
  <line x1="331" y1="65" x2="351" y2="65" stroke="#475569" stroke-width="3"/>
  <text x="12" y="104" font-size="11" fill="#64748b">☰ Гамбургер товч — цэсийг нээх/хаах</text>

  <!-- Нээгдсэн навигацийн жагсаалт (баганаар) -->
  <rect x="14" y="116" width="347" height="38" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="14" y="160" width="347" height="38" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="14" y="204" width="347" height="38" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="14" y="248" width="347" height="38" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="150" y="140" font-size="13" fill="#475569">Нүүр</text>
  <text x="144" y="184" font-size="13" fill="#475569">Хичээл</text>
  <text x="134" y="228" font-size="13" fill="#475569">Wireframe</text>
  <text x="142" y="272" font-size="13" fill="#475569">Холбоо</text>
  <text x="12" y="308" font-size="11" fill="#64748b">Nav — баганаар жагсанэ (max-width: 640px)</text>

  <!-- Hero (дээшээ баганаар) -->
  <rect x="14" y="322" width="347" height="60" rx="4" fill="#cbd5e1"/>
  <rect x="14" y="392" width="300" height="12" rx="4" fill="#e2e8f0"/>
  <rect x="14" y="410" width="260" height="12" rx="4" fill="#e2e8f0"/>
  <rect x="14" y="434" width="140" height="36" rx="8" fill="#94a3b8"/>
  <text x="36" y="457" font-size="13" fill="#ffffff">CTA</text>
  <rect x="14" y="482" width="347" height="110" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <line x1="14" y1="482" x2="361" y2="592" stroke="#cbd5e1"/>
  <line x1="361" y1="482" x2="14" y2="592" stroke="#cbd5e1"/>
  <text x="132" y="542" font-size="12" fill="#64748b">Зураг (бүтээл дор)</text>

  <!-- Гарчиг -->
  <rect x="14" y="606" width="6" height="22" fill="#2563eb"/>
  <text x="30" y="624" font-size="17" fill="#1e3a8a" font-weight="bold">Секцийн гарчиг</text>

  <!-- Картууд — 1 баганаар дараалан -->
  <rect x="14" y="640" width="347" height="70" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="30" y="654" width="60" height="16" rx="8" fill="#dbeafe"/>
  <rect x="30" y="678" width="170" height="14" rx="4" fill="#cbd5e1"/>
  <rect x="30" y="698" width="280" height="10" rx="4" fill="#e2e8f0"/>
  <rect x="14" y="720" width="347" height="70" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="30" y="734" width="60" height="16" rx="8" fill="#dbeafe"/>
  <rect x="30" y="758" width="170" height="14" rx="4" fill="#cbd5e1"/>
  <rect x="30" y="778" width="280" height="10" rx="4" fill="#e2e8f0"/>
  <text x="12" y="760" font-size="0" fill="#64748b"></text>

  <!-- Footer (доогуур үргэлжлэнэ) -->
  <rect x="0" y="800" width="375" height="12" fill="#cbd5e1"/>
  <text x="150" y="798" font-size="0" fill="#475569">Footer</text>
</svg>
